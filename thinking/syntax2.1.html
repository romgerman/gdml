<!-- a comment -->

<Control>
  <!-- with children -->
  <Control></Control>
</Control>

<!-- without children -->
<Control />

<!-- set properties -->
 <Control prop_name="value" />

<!-- example of score bar -->

<MarginContainer
  anchor_left="0.15"
  anchor_top="0.03"
  anchor_right="0.85"
  anchor_bottom="0.08"
  grow_horizontal="GrowDirection.Both"
>
  <ProgressBar
    show_percentage="false"
    size_flags_vertical="SizeFlags.SIZE_FILL"
    [theme.background]="background"
    [theme.fill]="fill"
  >
    <ProgressBar.Resources>
      <StyleBoxFlat x:key="background" bg_color="#b7b7b7" />
      <StyleBoxFlat x:key="fill" bg_color="#ffff00" />
    </ProgressBar.Resources>
    <Label
      [label_settings]="settings"
      horizontal_alignment="HorizontalAlignment.HORIZONTAL_ALIGNMENT_CENTER"
      vertical_alignment="VerticalAlignment.VERTICAL_ALIGNMENT_CENTER"
      text="0"
    >
      <Label.Resources>
        <LabelSettings x:key="settings" font_size="32" font_color="#000000" />
      </Label.Resources>
    </Label>
  </ProgressBar>
</MarginContainer>
